name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      # Into its own folder, required by path: a PR tests the PR, not main.
      - name: Check out code
        uses: actions/checkout@v4
        with:
          path: package

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, dom, simplexml, zip
          tools: composer:v2

      # Plain PHP package: an empty composer project instead of Laravel; deps come from Packagist, no auth.
      - name: Install dependencies
        run: |
          mkdir runner && cd runner
          echo '{}' > composer.json
          composer config minimum-stability dev
          composer config prefer-stable true
          composer config repositories.package '{"type": "path", "url": "${{ github.workspace }}/package", "options": {"symlink": true}}'
          composer require --no-interaction flamix/commerceml:@dev
          composer require --no-interaction --dev phpunit/phpunit

      # Symlinked package: ../../autoload.php from phpunit.xml resolves inside package/, hence --bootstrap.
      - name: Run tests
        working-directory: runner
        run: >
          ./vendor/bin/phpunit ./vendor/flamix/commerceml/tests
          --configuration ./vendor/flamix/commerceml/phpunit.xml
          --bootstrap ./vendor/autoload.php
          --testdox
